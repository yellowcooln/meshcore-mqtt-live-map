name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install packet decoder for integration tests
        run: npm install --prefix backend @michaelhart/meshcore-decoder@0.3.0

      - name: Run tests
        env:
          MESHCORE_TEST_NODE_MODULES: ${{ github.workspace }}/backend/node_modules
        run: pytest -q
