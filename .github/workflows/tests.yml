name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production runtime (Python 3.15 / Node 24)
        run: docker build --build-arg APP_VERSION="$(tr -d '\r\n' < VERSION.txt)" -t meshmap-test backend

      - name: Run tests inside the production runtime
        run: |
          docker run --rm --tmpfs /data --tmpfs /backup \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            -e MESHCORE_TEST_NODE_MODULES=/app/node_modules \
            -e GIT_CHECK_ENABLED=false -e MQTT_HOST=127.0.0.1 \
            meshmap-test sh -ec '
              pip install -r /source/requirements-dev.txt
              pip check
              node --check /app/static/app.js
              node --check /app/static/map-renderer.mjs
              cd /source
              python -m pytest -q -ra -p no:cacheprovider
            '
